# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: juanluisavilacervera44
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: miranda-backend
service: miranda-backend
package:
  patterns:
    - "!./**"
    - "package.json"
    - "node_modules/**"
    - "dist/**"
    - "data/**"
    - "public/**"
provider:
  name: aws
  region: eu-west-3
  runtime: nodejs18.x
functions:
  app:
    handler: dist/lambda.handler
    events:
      - http:
          path: /
          method: ANY
          cors: true
      - http:
          path: /{proxy+}
          method: ANY
          cors: true